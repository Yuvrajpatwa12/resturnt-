<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Chiyala - Elevated Dining">

  <title>Chiyala - SaaS</title>

  <!-- Cache Buster -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      inset: 0; overflow: hidden; margin: 0; padding: 0; position: fixed; background-color: #F4F6F9;
      font-family: sans-serif;
    }
    #loading {
      align-items: center; display: flex; flex-direction: column; height: 100%; justify-content: center; width: 100%;
    }
    .spinner {
      border: 5px solid rgba(0, 0, 0, 0.1); width: 40px; height: 40px; border-radius: 50%;
      border-left-color: #FF5C00; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <script>
    function log(msg, isError = false) {
      console.log("BOOT: " + msg);
    }

    window.onerror = function(message, source, lineno, colno, error) {
      log("JS ERROR: " + message + " at " + source + ":" + lineno, true);
    };

    // Global hook for Dart
    window.onFlutterAppStarted = function() {
      log("DART SIGNAL RECEIVED: App is alive!");
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
      }, 500);
    };

    log("Script initialized. Starting bootstrap...");
  </script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p style="color: #FF5C00; font-weight: bold; margin-top: 20px;">CHIYALA v1.1.7</p>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
