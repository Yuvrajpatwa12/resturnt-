<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Chiyala - Elevated Dining">

  <title>Chiyala - SaaS</title>

  <!-- Cache Buster -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      inset: 0; overflow: hidden; margin: 0; padding: 0; position: fixed; background-color: #F4F6F9;
      font-family: sans-serif;
    }
    #loading {
      align-items: center; display: flex; flex-direction: column; height: 100%; justify-content: center; width: 100%;
    }
    .spinner {
      border: 5px solid rgba(0, 0, 0, 0.1); width: 40px; height: 40px; border-radius: 50%;
      border-left-color: #FF5C00; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <script>
    const notificationSoundFiles = {
      notification: "notification.wav",
      order_success: "order_success.wav",
      sendwaves: "sendwaves.wav"
    };
    const notificationAudio = new Map();

    function getNotificationAudio(sound) {
      const file = notificationSoundFiles[sound];
      if (!file) {
        console.error("Unknown notification sound:", sound);
        return null;
      }

      if (!notificationAudio.has(sound)) {
        const audio = new Audio(
          new URL("sounds/" + file + "?v=20261026-2", document.baseURI)
        );
        audio.preload = "auto";
        notificationAudio.set(sound, audio);
      }
      return notificationAudio.get(sound);
    }

    window.addEventListener("pointerdown", () => {
      for (const sound of Object.keys(notificationSoundFiles)) {
        const audio = getNotificationAudio(sound);
        if (!audio) continue;

        audio.muted = true;
        audio.play().then(() => {
          audio.pause();
          audio.currentTime = 0;
          audio.muted = false;
        }).catch((error) => {
          audio.muted = false;
          console.warn("Could not unlock notification sound:", error);
        });
      }
    }, { once: true, capture: true });

    window.playNotificationSound = function(sound = "notification") {
      const audio = getNotificationAudio(sound);
      if (!audio) return;
      audio.currentTime = 0;
      audio.play().catch((error) => {
        console.warn("Could not play notification sound:", error);
      });
    };

    function log(msg, isError = false) {
      console.log("BOOT: " + msg);
    }

    window.onerror = function(message, source, lineno, colno, error) {
      log("JS ERROR: " + message + " at " + source + ":" + lineno, true);
    };

    // Global hook for Dart
    window.onFlutterAppStarted = function() {
      log("DART SIGNAL RECEIVED: App is alive!");
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
      }, 500);
    };

    log("Script initialized. Starting bootstrap...");
  </script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p style="color: #FF5C00; font-weight: bold; margin-top: 20px;">CHIYALA v1.1.7</p>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
